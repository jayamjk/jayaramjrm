<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foundation — Design System Generator</title>
<!-- Fluent 2 uses Segoe UI, a system font on Windows — no web font link
     needed here; the stack falls back gracefully on other OSes. Google
     Fonts preconnects stay since the Typography tab's font picker still
     loads user-selected fonts for the generated design system. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Icons are fetched live as SVG from the Iconify API (see fetchIconSvg) — no webfont CDN needed. -->
<style>
:root{
  /* Fluent 2 design tokens — the tool's OWN interface only. Kept
     deliberately separate from the c/a/radius/shadow token families below,
     which are the user's generated design-system tokens.
     Values match Microsoft's published Fluent 2 web theme (neutral ramp +
     "Web Blue" brand ramp). */
  --ink:#242424; --ink-soft:#616161; --canvas:#FAFAFA; --panel:#FFFFFF; --panel-sunken:#F5F5F5;
  --line:#E0E0E0; --line-strong:#D1D1D1; --accent:#0F6CBD; --accent-soft:#EBF3FC; --accent-ink:#0F548C;
  --accent-hover:#115EA3; --accent-pressed:#0F4979;
  --good:#0E700E; --warn:#9A6200; --bad:#D13438;
  /* Fluent's actual corner-radius scale — noticeably tighter than the
     previous Vercel pass (borderRadiusSmall/Medium/Large). */
  --ui-radius-sm:4px; --ui-radius-md:4px; --ui-radius-lg:8px;
  /* Fluent elevation shadows — two-layer (ambient + key), per Microsoft's
     shadow2/shadow8 tokens. */
  --ui-shadow-sm:0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
  --ui-shadow-md:0 0 2px rgba(0,0,0,0.12), 0 4px 8px rgba(0,0,0,0.14);
  /* Fluent's real font stack — Segoe UI is a system font (Windows), so like
     Microsoft's own web apps we declare it first and let the OS provide it,
     falling back gracefully rather than substituting a Google Font. */
  --ui-font:'Segoe UI','Segoe UI Web',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',sans-serif;
  --ui-display:var(--ui-font);
  --ui-mono:'Cascadia Code','Consolas',ui-monospace,Menlo,monospace;
  /* legacy aliases kept so any stray var(--radius-*)/var(--shadow-*) reference
     in pure-chrome rules still resolves sensibly before the runtime token
     values are applied on first render */
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(20,20,25,0.06);
  --shadow-md:0 6px 24px -8px rgba(20,20,25,0.18);
  --sidebar-w:380px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--ui-font);background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden;}
::selection{background:var(--accent);color:#fff;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--ink-soft);}

/* ============ APP SHELL ============ */
.app{display:grid;grid-template-rows:56px 48px 1fr;height:100vh;}

/* ---- topbar ---- */
.topbar{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:var(--panel);flex-shrink:0;}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--ui-display);font-weight:600;font-size:15px;letter-spacing:-0.01em;}
.brand .mark{width:24px;height:24px;border-radius:var(--ui-radius-sm);background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--ui-display);font-size:12px;font-weight:700;flex-shrink:0;}
.topbar-right{display:flex;align-items:center;gap:10px;}

/* ---- section nav (Fluent TabList pattern — underline indicator, not filled pills) ---- */
.section-nav{height:44px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:stretch;padding:0 20px;gap:4px;overflow-x:auto;flex-shrink:0;}
.snav-btn{display:flex;align-items:center;gap:7px;padding:0 12px;border-radius:0;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--ink-soft);font-family:var(--ui-font);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:color .1s ease,border-color .1s ease;}
.snav-btn:hover{color:var(--ink);background:var(--panel-sunken);}
.snav-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:transparent;}
.snav-btn .n{font-family:var(--ui-mono);font-size:10px;opacity:.6;}

/* ============ BUTTONS (Fluent Button — filled primary / outline secondary) ============ */
.btn{font-family:var(--ui-font);font-size:13px;font-weight:600;border-radius:var(--ui-radius-sm);padding:0 13px;height:32px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .1s ease,border-color .1s ease;white-space:nowrap;}
.btn:hover{background:var(--panel-sunken);border-color:#C7C7C7;}
.btn:active{background:#E0E0E0;}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);}
.btn-primary:active{background:var(--accent-pressed);border-color:var(--accent-pressed);}
.btn-primary:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-accent:hover{background:var(--accent-hover);border-color:var(--accent-hover);}
.btn-accent:active{background:var(--accent-pressed);border-color:var(--accent-pressed);}
.btn-sm{padding:0 9px;height:24px;font-size:12px;border-radius:var(--ui-radius-sm);}
.btn-icon{padding:0;width:32px;height:32px;justify-content:center;}
.btn-block{width:100%;justify-content:center;}

/* ============ MAIN 2-PANE LAYOUT ============ */
.workspace{display:grid;grid-template-columns:var(--sidebar-w) 1fr;overflow:hidden;}
.sidebar{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;height:100%;}
.sidebar-body{padding:4px 0 60px;}
.sidebar-section-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:15px 20px 13px;border-bottom:1px solid var(--line);
  font-family:var(--ui-display);font-weight:600;font-size:14px;color:var(--ink);
  position:sticky;top:0;background:var(--panel);z-index:5;
}
.reset-ghost-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:transparent;border:1px solid transparent;border-radius:var(--ui-radius-sm);
  padding:4px 8px;font-family:var(--ui-font);font-size:11.5px;font-weight:600;
  color:var(--ink-soft);cursor:pointer;transition:all .12s ease;
}
.reset-ghost-btn:hover{background:var(--panel-sunken);border-color:var(--line);color:var(--bad);}
.reset-ghost-btn i{font-size:13px;}
.main-scroll{overflow-y:auto;height:100%;background:var(--canvas);}
.stage{padding:32px;padding-bottom:80px;min-height:100%;box-sizing:border-box;}
.stage.stage-flush{padding:0;}

/* ============ CONTROL GROUPS (Fluent Accordion — collapsible, so density
   stops being a problem regardless of how many settings a tab has) ============ */
.group{border-bottom:1px solid var(--line);}
.group:last-child{border-bottom:none;}
.group-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 20px;cursor:pointer;user-select:none;background:var(--panel);transition:background .1s ease;}
.group-head:hover{background:var(--panel-sunken);}
.group-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
.group-chevron{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:transform .15s ease;}
.group.open .group-chevron{transform:rotate(90deg);}
.group-body{padding:2px 20px 17px;}
.group-title{font-family:var(--ui-display);font-size:12.5px;font-weight:600;color:var(--ink);margin:0;display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.group-title .hint{font-family:var(--ui-mono);font-size:10px;color:var(--ink-soft);font-weight:500;}
.group-desc{font-size:12px;color:var(--ink-soft);line-height:1.55;margin:0 0 14px;}

.field{margin-bottom:14px;}
.field:last-child{margin-bottom:0;}
.field-label{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:500;color:var(--ink-soft);margin-bottom:7px;}

/* ============ STEPPER (increment/decrement) ============ */
.stepper-row{display:flex;align-items:center;gap:0;border:1px solid var(--line-strong);border-radius:var(--ui-radius-sm);overflow:hidden;background:var(--panel);}
.stepper-btn{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;background:var(--panel-sunken);color:var(--ink);cursor:pointer;font-size:15px;font-weight:600;user-select:none;transition:background .1s ease;}
.stepper-btn:hover:not(:disabled){background:var(--line);}
.stepper-btn:active:not(:disabled){background:var(--line-strong);}
.stepper-btn:disabled{opacity:.35;cursor:not-allowed;}
.stepper-val{flex:1;text-align:center;font-family:var(--ui-mono);font-size:13px;font-weight:600;color:var(--ink);}

/* ============ INFO PILLS (read-only breakpoint / summary chips) ============ */
.info-pillrow{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.info-pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:500;color:var(--ink-soft);background:var(--panel-sunken);border:1px solid var(--line);border-radius:var(--ui-radius-sm);padding:3px 9px 3px 10px;white-space:nowrap;}
.info-pill b{font-family:var(--ui-mono);font-weight:700;color:var(--accent);}
.mini-link{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--accent);text-decoration:none;cursor:pointer;}
.mini-link:hover{text-decoration:underline;}
.readout-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:12.5px;}
.readout-row .lbl{color:var(--ink-soft);}
.readout-row .val{font-family:var(--ui-mono);font-weight:600;color:var(--ink);}
.empty-hint{font-size:11.5px;color:var(--ink-soft);line-height:1.55;background:var(--panel-sunken);border:1px dashed var(--line-strong);border-radius:var(--ui-radius-sm);padding:9px 11px;}
.field-label .val{font-family:var(--ui-mono);font-size:11px;color:var(--ink);background:var(--panel-sunken);border:1px solid var(--line);padding:2px 6px;border-radius:var(--ui-radius-sm);font-weight:500;}

input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:var(--line-strong);outline:none;margin:10px 0 4px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--accent);cursor:pointer;box-shadow:var(--ui-shadow-sm);transition:transform .1s ease;}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.1);}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--accent);cursor:pointer;}

select,input[type=text],input[type=number],input[type=search]{width:100%;font-family:var(--ui-font);font-size:13px;padding:7px 10px;border-radius:var(--ui-radius-sm);border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);outline:none;transition:border-color .12s ease,box-shadow .12s ease;appearance:none;}
select{background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%23616161' d='M6 8L0 0h12z'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;background-size:10px;padding-right:28px;cursor:pointer;}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

.seg{display:flex;background:var(--panel-sunken);border:1px solid var(--line);border-radius:var(--ui-radius-sm);padding:2px;gap:2px;}
.seg button{flex:1;border:none;background:transparent;padding:6px 6px;font-size:12px;font-weight:600;font-family:var(--ui-font);color:var(--ink-soft);border-radius:var(--ui-radius-sm);cursor:pointer;transition:all .12s ease;}
.seg button.active{background:var(--panel);color:var(--accent);box-shadow:var(--ui-shadow-sm);}
.seg button:hover:not(.active){color:var(--ink);}

.toggle-row{display:flex;align-items:center;justify-content:space-between;}
.toggle-row .field-label{margin-bottom:0;}
.switch{position:relative;width:38px;height:20px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch .slider{position:absolute;inset:0;background:var(--panel);border:1px solid var(--ink-soft);border-radius:20px;cursor:pointer;transition:background .15s ease,border-color .15s ease;}
.switch .slider::before{content:'';position:absolute;width:14px;height:14px;left:2px;top:2px;background:var(--ink-soft);border-radius:50%;transition:transform .15s ease,background .15s ease;}
.switch input:checked + .slider{background:var(--accent);border-color:var(--accent);}
.switch input:checked + .slider::before{transform:translateX(18px);background:#fff;}

.pillrow{display:flex;flex-wrap:wrap;gap:6px;}
.pill{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:var(--ui-radius-sm);border:1px solid var(--line-strong);background:var(--panel);color:var(--ink-soft);cursor:pointer;transition:all .12s ease;}
.pill:hover{border-color:var(--ink-soft);}
.pill.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:700;}

.color-input-row{display:flex;align-items:center;gap:8px;}
.swatch-input{width:36px;height:36px;border-radius:var(--ui-radius-sm);border:1px solid var(--line);cursor:pointer;padding:0;flex-shrink:0;background:none;}
.swatch-input::-webkit-color-swatch-wrapper{padding:2px;}
.swatch-input::-webkit-color-swatch{border-radius:5px;border:none;}
.hex-input{font-family:var(--ui-mono);text-transform:uppercase;}

/* ============ RICH COLOR PICKER ============ */
.rcp-wrap{outline:none;border-radius:var(--ui-radius-md);}
.rcp-wrap:focus-visible{box-shadow:0 0 0 3px var(--accent-soft);}
.rcp-top-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.rcp-swatch{position:relative;width:44px;height:44px;border-radius:var(--ui-radius-sm);border:1px solid var(--line);cursor:pointer;flex-shrink:0;overflow:hidden;}
.rcp-hex{flex:1;font-size:15px;font-weight:600;}
.rcp-slider-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.rcp-rgb-label{width:12px;font-family:var(--ui-mono);font-size:11px;font-weight:700;color:var(--ink-soft);flex-shrink:0;}
.rcp-rgb-slider{-webkit-appearance:none;flex:1;height:10px;border-radius:6px;outline:none;cursor:pointer;}
.rcp-rgb-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--ink);cursor:grab;box-shadow:var(--ui-shadow-sm);}
.rcp-rgb-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--ink);cursor:grab;}
.rcp-rgb-val{width:28px;font-family:var(--ui-mono);font-size:11px;color:var(--ink-soft);text-align:right;flex-shrink:0;}

/* ============ FONT PICKER ============ */
.fp-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--ui-radius-sm);background:var(--panel);cursor:pointer;font-size:14px;color:var(--ink);text-align:left;}
.fp-trigger:hover{border-color:var(--line-strong);}
.fp-trigger .chev{color:var(--ink-soft);font-size:10px;flex-shrink:0;transition:transform .12s ease;}
.fp-trigger.open .chev{transform:rotate(180deg);}
.fp-panel{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--ui-radius-md);box-shadow:var(--ui-shadow-md);z-index:30;overflow:hidden;display:flex;flex-direction:column;max-height:400px;}
.fp-search{border:none;border-bottom:1px solid var(--line);border-radius:0;padding:11px 14px;font-size:13.5px;width:100%;}
.fp-search:focus{border-color:var(--line);box-shadow:none;}
.fp-cats{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0;}
.fp-cat-pill{font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.fp-cat-pill.active{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600;}
.fp-list{overflow-y:auto;flex:1;}
.fp-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;gap:12px;}
.fp-row:hover{background:var(--panel-sunken);}
.fp-row .fname{font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fp-row .fcat{font-size:10.5px;color:var(--ink-soft);text-transform:capitalize;flex-shrink:0;}
.fp-empty{padding:24px 14px;text-align:center;font-size:12.5px;color:var(--ink-soft);}
.fp-footer{padding:8px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-soft);text-align:center;flex-shrink:0;background:var(--panel-sunken);}

/* ============ MODAL / TOAST ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:30px;backdrop-filter:blur(2px);}
.modal{background:var(--panel);border-radius:var(--ui-radius-lg);border:1px solid var(--line);width:100%;max-width:780px;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 60px -15px rgba(0,0,0,0.3);overflow:hidden;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line);flex-shrink:0;}
.modal-head h3{margin:0;font-family:var(--ui-display);font-weight:600;font-size:15px;}
.modal-tabs{display:flex;gap:4px;padding:12px 22px 0;border-bottom:1px solid var(--line);flex-shrink:0;overflow-x:auto;}
.modal-body{padding:0;overflow-y:auto;flex:1;position:relative;}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;}
.code-block{margin:0;padding:20px 22px;font-family:var(--ui-mono);font-size:12.5px;line-height:1.75;color:#D9E0FF;background:#111;white-space:pre;overflow-x:auto;}
.copy-toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:var(--ui-radius-sm);font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:all .2s ease;z-index:200;box-shadow:var(--ui-shadow-md);}
.copy-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ============ SECTION HEADER (in stage) ============ */
.stage-head{margin-bottom:24px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;}
.stage-head-text{flex:1;min-width:0;}
.stage-head-actions{flex-shrink:0;}
.stage-head h1{font-family:var(--ui-display);font-size:20px;font-weight:600;margin:0 0 6px;letter-spacing:-0.015em;}
.stage-head p{font-size:13.5px;color:var(--ink-soft);margin:0;max-width:640px;line-height:1.55;}

/* ============ COLORS ============ */
.palette-group{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.palette-block{padding:16px 20px;border-bottom:1px solid var(--line);}
.palette-block:last-child{border-bottom:none;}
.palette-block-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
.palette-block-head h3{font-family:var(--ui-display);font-size:14px;font-weight:600;margin:0;}
.palette-block-head .sub{font-family:var(--ui-mono);font-size:11px;color:var(--ink-soft);}
.swatch-row{display:grid;grid-template-columns:repeat(11,1fr);gap:5px;}
.swatch{position:relative;height:82px;display:flex;flex-direction:column;justify-content:space-between;padding:8px 9px;cursor:pointer;transition:transform .1s ease;border-radius:var(--ui-radius-md);}
.swatch:hover{transform:scale(1.03);z-index:2;box-shadow:var(--ui-shadow-md);}
.swatch .step{font-family:var(--ui-mono);font-size:10.5px;font-weight:700;}
.swatch .hex{font-family:var(--ui-mono);font-size:9px;opacity:.85;}
.swatch .badge{position:absolute;bottom:7px;right:8px;font-family:var(--ui-mono);font-size:7px;font-weight:600;padding:1.5px 4px;border-radius:3px;letter-spacing:.01em;opacity:.75;}
.swatch.is-anchor{z-index:1;}
.swatch.is-anchor .anchor-dot{position:absolute;top:7px;right:8px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 0 .2px var(--ink), 0 1px 2px rgba(0,0,0,.3);}

/* ============ SPACING ============ */
.space-table{border:1px solid var(--line);border-radius:var(--ui-radius-md);overflow:hidden;background:var(--panel);}
.space-row{display:grid;grid-template-columns:70px 90px 90px 1fr;align-items:center;gap:16px;padding:11px 18px;border-bottom:1px solid var(--line);}
.space-row:last-child{border-bottom:none;}
.space-row:hover{background:var(--panel-sunken);}
.space-row .name{font-family:var(--ui-mono);font-size:12px;font-weight:700;color:var(--ink);}
.space-row .px,.space-row .rem{font-family:var(--ui-mono);font-size:11.5px;color:var(--ink-soft);}
.space-bar{height:12px;background:var(--ink);border-radius:2px;}
.radius-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.radius-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--ui-radius-md);padding:18px;text-align:center;}
.radius-demo{width:100%;height:70px;background:var(--panel-sunken);border:1.5px solid var(--ink);margin-bottom:12px;}
.radius-card .name{font-family:var(--ui-mono);font-weight:700;font-size:12px;}
.radius-card .val{font-family:var(--ui-mono);font-size:11px;color:var(--ink-soft);}
.container-table{border:1px solid var(--line);border-radius:var(--ui-radius-md);overflow:hidden;background:var(--panel);margin-bottom:0;}
.grid-preview{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--ui-radius-md);padding:24px;}
.grid-preview .cols{display:grid;}
.grid-preview .col{background:var(--panel-sunken);border:1px dashed var(--line-strong);height:120px;border-radius:5px;}

/* ============ SHADOWS ============ */
.shadow-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
.shadow-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--ui-radius-lg);padding:26px 20px;text-align:center;}
.shadow-demo{width:100%;height:88px;background:var(--panel);border-radius:var(--ui-radius-md);margin-bottom:16px;}
.shadow-card .name{font-family:var(--ui-display);font-weight:600;font-size:13.5px;margin-bottom:4px;}
.shadow-card .css{font-family:var(--ui-mono);font-size:9.5px;color:var(--ink-soft);word-break:break-all;line-height:1.5;background:var(--panel-sunken);border-radius:5px;padding:8px;margin-top:10px;cursor:pointer;}

/* ============ ICONS ============ */
.icon-toolbar{display:flex;gap:10px;margin-bottom:20px;align-items:center;}
.icon-toolbar input[type=search]{max-width:280px;}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;}
.icon-tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--ui-radius-md);padding:16px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:all .1s ease;}
.icon-tile-glyph{display:flex;align-items:center;justify-content:center;line-height:1;}
.icon-tile-glyph svg{display:block;}
.icon-tile:hover{border-color:var(--ink);background:var(--panel-sunken);}
.icon-tile .lbl{font-size:10px;color:var(--ink-soft);text-align:center;line-height:1.3;word-break:break-word;}

/* ============ COMPONENTS / BUTTONS ============ */
.btn-gallery-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--ui-radius-md);overflow:hidden;}
.btn-gallery-table th{text-align:left;font-family:var(--ui-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel-sunken);}
.btn-gallery-table td{padding:16px;border-bottom:1px solid var(--line);vertical-align:middle;}
.btn-gallery-table tr:last-child td{border-bottom:none;}
.btn-gallery-table td.rowlabel{font-family:var(--ui-display);font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap;}
.comp-subhead{font-family:var(--ui-display);font-size:13.5px;font-weight:600;margin:34px 0 14px;display:flex;align-items:center;gap:8px;color:var(--ink);}
.comp-subhead:first-child{margin-top:0;}
.demo-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--ui-radius-md);padding:22px;}

/* generated component button base — tokens applied via CSS vars from state */
.gbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--btn-font,var(--ui-font));font-weight:var(--btn-weight,600);
  border-radius:var(--btn-radius,8px);
  border:1.5px solid transparent;
  cursor:pointer;
  transition:filter .1s ease, transform .05s ease, opacity .1s ease;
  line-height:1;
}
.gbtn .icn{display:inline-flex;font-size:1.15em;line-height:1;}
.gicon{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;flex-shrink:0;line-height:0;}
.gicon-loading{width:65%;height:65%;border-radius:50%;background:currentColor;opacity:.15;animation:gicon-pulse 1s ease-in-out infinite;}
@keyframes gicon-pulse{0%,100%{opacity:.1;}50%{opacity:.3;}}
.gicon svg{width:100%;height:100%;display:block;}
.gbtn-md{padding:10px 18px;font-size:14px;}
.gbtn-sm{padding:7px 13px;font-size:12.5px;}
.gbtn-lg{padding:13px 24px;font-size:15.5px;}
.gbtn-icononly.gbtn-md{padding:10px;width:38px;}
.gbtn-icononly.gbtn-sm{padding:7px;width:30px;}
.gbtn-icononly.gbtn-lg{padding:13px;width:48px;}

.gbtn-primary{background:var(--a-primary-base);border-color:var(--a-primary-base);color:var(--a-primary-fg);}
.gbtn-primary.st-hover{background:var(--a-primary-hover);border-color:var(--a-primary-hover);}
.gbtn-primary.st-active{background:var(--a-primary-active);border-color:var(--a-primary-active);transform:scale(.97);}
.gbtn-primary.st-focus{background:var(--a-primary-base);box-shadow:0 0 0 3px var(--a-primary-soft);}

.gbtn-secondary{background:var(--a-secondary-base);border-color:var(--a-secondary-base);color:var(--a-secondary-fg);}
.gbtn-secondary.st-hover{background:var(--a-secondary-hover);border-color:var(--a-secondary-hover);}
.gbtn-secondary.st-active{background:var(--a-secondary-active);border-color:var(--a-secondary-active);transform:scale(.97);}
.gbtn-secondary.st-focus{background:var(--a-secondary-base);box-shadow:0 0 0 3px var(--a-secondary-soft);}

.gbtn-outline{background:transparent;border-color:var(--a-primary-base);color:var(--a-primary-base);}
.gbtn-outline.st-hover{background:var(--a-primary-soft);}
.gbtn-outline.st-active{background:var(--a-primary-soft);transform:scale(.97);}
.gbtn-outline.st-focus{box-shadow:0 0 0 3px var(--a-primary-soft);}

.gbtn-ghost{background:transparent;border-color:transparent;color:var(--a-neutral-text-default);}
.gbtn-ghost.st-hover{background:var(--a-neutral-surface-sunken);}
.gbtn-ghost.st-active{background:var(--a-neutral-border);transform:scale(.97);}
.gbtn-ghost.st-focus{box-shadow:0 0 0 3px var(--a-neutral-border);}

.gbtn-destructive{background:var(--a-error-base);border-color:var(--a-error-base);color:var(--a-error-fg);}
.gbtn-destructive.st-hover{background:var(--a-error-hover);border-color:var(--a-error-hover);}
.gbtn-destructive.st-active{background:var(--a-error-active);border-color:var(--a-error-active);transform:scale(.97);}
.gbtn-destructive.st-focus{box-shadow:0 0 0 3px var(--a-error-soft);}

.gbtn-link{background:transparent;border-color:transparent;color:var(--a-primary-base);padding-left:2px;padding-right:2px;text-decoration:none;}
.gbtn-link.st-hover{text-decoration:underline;color:var(--a-primary-hover);}
.gbtn-link.st-active{color:var(--a-primary-active);}
.gbtn-link.st-focus{box-shadow:0 0 0 3px var(--a-primary-soft);border-radius:4px;}

.gbtn.st-disabled{opacity:.45;cursor:not-allowed;}
.gbtn.st-loading{opacity:.85;cursor:progress;}
.spinner{width:1em;height:1em;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:currentColor;animation:spin .7s linear infinite;display:inline-block;}
.gbtn-outline .spinner,.gbtn-ghost .spinner,.gbtn-link .spinner{border:2px solid rgba(0,0,0,.15);border-top-color:currentColor;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============ NEW COMPONENTS: shared field chrome ============ */
.gfield{font-family:var(--font-body,var(--ui-font));}
.gfield-label{display:block;font-size:13px;font-weight:600;color:var(--a-neutral-text-default);margin-bottom:6px;}
.gfield-hint{font-size:12px;color:var(--a-neutral-text-muted);margin-top:6px;}
.gfield-error-text{font-size:12px;color:var(--a-error-base);margin-top:6px;display:flex;align-items:center;gap:5px;}

.ginput-wrap{position:relative;display:flex;align-items:center;}
.ginput{
  width:100%;font-family:var(--font-body,var(--ui-font));font-size:14px;color:var(--a-neutral-text-default);
  background:var(--a-neutral-surface);border:1.5px solid var(--a-neutral-border);border-radius:var(--btn-radius,8px);
  padding:10px 13px;outline:none;transition:border-color .12s ease, box-shadow .12s ease;
}
.ginput::placeholder{color:var(--a-neutral-text-subtle);}
.ginput.icon-left{padding-left:38px;}
.ginput.icon-right{padding-right:38px;}
.ginput-icon{position:absolute;left:12px;color:var(--a-neutral-text-muted);font-size:16px;display:flex;pointer-events:none;}
.ginput-icon.right{left:auto;right:12px;}
.ginput.st-focus{border-color:var(--a-primary-base);box-shadow:0 0 0 3px var(--a-primary-soft);}
.ginput.st-filled{border-color:var(--a-neutral-border-strong);}
.ginput.st-error{border-color:var(--a-error-base);}
.ginput.st-error.st-focus{box-shadow:0 0 0 3px var(--a-error-soft);}
.ginput.st-disabled{background:var(--a-neutral-surface-sunken);color:var(--a-neutral-text-subtle);cursor:not-allowed;}
.gtextarea{min-height:92px;resize:vertical;font-family:var(--font-body,var(--ui-font));line-height:1.5;}

.gselect-wrap{position:relative;}
.gselect{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:36px;}
.gselect-chevron{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--a-neutral-text-muted);pointer-events:none;font-size:15px;}

.gcheck-row{display:flex;align-items:flex-start;gap:10px;}
.gcheck-box{
  width:20px;height:20px;flex-shrink:0;border-radius:6px;border:1.5px solid var(--a-neutral-border-strong);
  background:var(--a-neutral-surface);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;
  transition:all .1s ease;
}
.gcheck-box.checked{background:var(--a-primary-base);border-color:var(--a-primary-base);}
.gcheck-box.st-focus{box-shadow:0 0 0 3px var(--a-primary-soft);}
.gcheck-box.st-error{border-color:var(--a-error-base);}
.gcheck-box.st-disabled{opacity:.45;}
.gradio-box{
  width:20px;height:20px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--a-neutral-border-strong);
  background:var(--a-neutral-surface);display:flex;align-items:center;justify-content:center;transition:all .1s ease;
}
.gradio-box .dot{width:9px;height:9px;border-radius:50%;background:var(--a-primary-base);opacity:0;transform:scale(.4);transition:all .1s ease;}
.gradio-box.checked{border-color:var(--a-primary-base);}
.gradio-box.checked .dot{opacity:1;transform:scale(1);}
.gradio-box.st-focus{box-shadow:0 0 0 3px var(--a-primary-soft);}
.gradio-box.st-disabled{opacity:.45;}
.gcheck-label{font-size:13.5px;color:var(--a-neutral-text-default);line-height:1.4;}
.gcheck-label .sub{display:block;font-size:12px;color:var(--a-neutral-text-muted);margin-top:2px;}

.gtoggle{
  width:42px;height:24px;border-radius:20px;background:var(--a-neutral-border-strong);position:relative;flex-shrink:0;
  cursor:pointer;transition:background .15s ease;
}
.gtoggle::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .15s ease;box-shadow:var(--shadow-sm);}
.gtoggle.checked{background:var(--a-primary-base);}
.gtoggle.checked::after{transform:translateX(18px);}
.gtoggle.st-focus{box-shadow:0 0 0 3px var(--a-primary-soft);}
.gtoggle.st-disabled{opacity:.45;cursor:not-allowed;}

.gbadge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;font-family:var(--font-body,var(--ui-font));}
.gbadge-primary{background:var(--a-primary-soft);color:var(--a-primary-hover);}
.gbadge-secondary{background:var(--a-secondary-soft);color:var(--a-secondary-hover);}
.gbadge-success{background:var(--a-success-soft);color:var(--a-success-hover);}
.gbadge-warning{background:var(--a-warning-soft);color:var(--a-warning-hover);}
.gbadge-error{background:var(--a-error-soft);color:var(--a-error-hover);}
.gbadge-neutral{background:var(--a-neutral-surface-sunken);color:var(--a-neutral-text-muted);}
.gbadge-solid{color:#fff;}
.gbadge-solid.gbadge-primary{background:var(--a-primary-base);color:var(--a-primary-fg);}
.gbadge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

.gtag{display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 12px;border-radius:8px;font-size:12.5px;font-weight:600;background:var(--a-neutral-surface-sunken);color:var(--a-neutral-text-default);border:1px solid var(--a-neutral-border);}
.gtag-remove{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--a-neutral-border);cursor:pointer;font-size:10px;color:var(--a-neutral-text-muted);}
.gtag-primary{background:var(--a-primary-soft);border-color:transparent;color:var(--a-primary-hover);}

.galert{display:flex;gap:12px;padding:14px 16px;border-radius:10px;border:1px solid;font-family:var(--font-body,var(--ui-font));}
.galert-icon{font-size:18px;flex-shrink:0;line-height:1.3;}
.galert-title{font-size:13.5px;font-weight:700;margin-bottom:2px;}
.galert-body{font-size:13px;line-height:1.5;}
.galert-success{background:var(--a-success-soft);border-color:var(--a-success-border);color:var(--a-success-hover);}
.galert-warning{background:var(--a-warning-soft);border-color:var(--a-warning-border);color:var(--a-warning-hover);}
.galert-error{background:var(--a-error-soft);border-color:var(--a-error-border);color:var(--a-error-hover);}
.galert-info{background:var(--a-info-soft);border-color:var(--a-info-border);color:var(--a-info-hover);}

.gdivider{border:none;height:1px;background:var(--a-neutral-border);margin:0;}
.gdivider-label-row{display:flex;align-items:center;gap:14px;color:var(--a-neutral-text-muted);font-size:12px;font-weight:600;}
.gdivider-label-row .line{flex:1;height:1px;background:var(--a-neutral-border);}

/* ============ BATCH 2 COMPONENTS ============ */

/* ---- Accordion ---- */
.gaccordion{border:1px solid var(--a-neutral-border);border-radius:12px;overflow:hidden;background:var(--a-neutral-surface);}
.gacc-item{border-bottom:1px solid var(--a-neutral-border);}
.gacc-item:last-child{border-bottom:none;}
.gacc-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;cursor:pointer;font-family:var(--font-body,var(--ui-font));font-weight:600;font-size:14px;color:var(--a-neutral-text-default);transition:background .1s ease;}
.gacc-head:hover{background:var(--a-neutral-surface-sunken);}
.gacc-item.st-disabled .gacc-head{color:var(--a-neutral-text-subtle);cursor:not-allowed;}
.gacc-item.st-disabled .gacc-head:hover{background:transparent;}
.gacc-chevron{transition:transform .15s ease;color:var(--a-neutral-text-muted);display:flex;}
.gacc-item.open .gacc-chevron{transform:rotate(180deg);}
.gacc-body{padding:0 18px 18px;font-size:13.5px;line-height:1.6;color:var(--a-neutral-text-muted);}

/* ---- Tabs ---- */
.gtabs-list{display:flex;gap:4px;border-bottom:1.5px solid var(--a-neutral-border);}
.gtab-item{padding:10px 16px;font-family:var(--font-body,var(--ui-font));font-weight:600;font-size:13.5px;color:var(--a-neutral-text-muted);border-bottom:2px solid transparent;margin-bottom:-1.5px;cursor:pointer;transition:all .12s ease;}
.gtab-item:hover{color:var(--a-neutral-text-default);}
.gtab-item.active{color:var(--a-primary-base);border-bottom-color:var(--a-primary-base);}
.gtab-item.st-disabled{color:var(--a-neutral-text-subtle);cursor:not-allowed;}
.gtabs-pill{display:flex;gap:2px;background:var(--a-neutral-surface-sunken);border:1px solid var(--a-neutral-border);border-radius:9px;padding:3px;width:fit-content;}
.gtabs-pill .gtab-item{border-bottom:none;margin-bottom:0;border-radius:6px;padding:7px 14px;}
.gtabs-pill .gtab-item.active{background:var(--a-neutral-surface);box-shadow:var(--shadow-sm);}
.gtabs-panel{padding:16px 2px;font-size:13.5px;color:var(--a-neutral-text-muted);line-height:1.6;}

/* ---- Tooltip ---- */
.gtooltip-demo{position:relative;display:inline-block;}
.gtooltip-bubble{
  position:absolute;left:50%;transform:translateX(-50%);
  background:var(--a-neutral-text-default);color:var(--a-neutral-surface);
  font-size:12px;font-weight:600;padding:6px 10px;border-radius:7px;white-space:nowrap;
  box-shadow:var(--shadow-md);z-index:2;
}
.gtooltip-bubble.pos-top{bottom:calc(100% + 9px);}
.gtooltip-bubble.pos-bottom{top:calc(100% + 9px);}
.gtooltip-bubble::after{content:'';position:absolute;left:50%;transform:translateX(-50%);width:8px;height:8px;background:inherit;}
.gtooltip-bubble.pos-top::after{bottom:-4px;clip-path:polygon(0 0,100% 0,50% 100%);}
.gtooltip-bubble.pos-bottom::after{top:-4px;clip-path:polygon(50% 0,0 100%,100% 100%);}

/* ---- Button Group ---- */
.gbtn-group{display:inline-flex;border-radius:8px;overflow:hidden;border:1.5px solid var(--a-primary-base);}
.gbtn-group button{
  font-family:var(--font-body,var(--ui-font));font-weight:600;font-size:13px;padding:9px 16px;
  background:var(--a-neutral-surface);color:var(--a-primary-base);border:none;border-right:1.5px solid var(--a-primary-base);
  cursor:pointer;transition:all .1s ease;
}
.gbtn-group button:last-child{border-right:none;}
.gbtn-group button.active{background:var(--a-primary-base);color:var(--a-primary-fg);}
.gbtn-group button.st-disabled{color:var(--a-neutral-text-subtle);cursor:not-allowed;}
.gbtn-group button:hover:not(.active):not(.st-disabled){background:var(--a-primary-soft);}

/* ---- Search ---- */
.gsearch-wrap{position:relative;}
.gsearch-kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--ui-mono);font-size:10.5px;color:var(--a-neutral-text-muted);background:var(--a-neutral-surface-sunken);border:1px solid var(--a-neutral-border);border-radius:5px;padding:2px 6px;}
.gsearch-results{margin-top:8px;background:var(--a-neutral-surface);border:1px solid var(--a-neutral-border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow-sm);}
.gsearch-result-row{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13px;color:var(--a-neutral-text-default);border-bottom:1px solid var(--a-neutral-border);cursor:pointer;}
.gsearch-result-row:last-child{border-bottom:none;}
.gsearch-result-row:hover{background:var(--a-neutral-surface-sunken);}
.gsearch-result-row .muted{color:var(--a-neutral-text-muted);font-size:11.5px;}

/* ---- Stepper (progress steps) ---- */
.gstepper{display:flex;align-items:flex-start;}
.gstep{display:flex;flex-direction:column;align-items:center;position:relative;flex:1;}
.gstep-circle{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:2px solid var(--a-neutral-border-strong);color:var(--a-neutral-text-muted);background:var(--a-neutral-surface);z-index:1;}
.gstep.done .gstep-circle{background:var(--a-primary-base);border-color:var(--a-primary-base);color:var(--a-primary-fg);}
.gstep.active .gstep-circle{border-color:var(--a-primary-base);color:var(--a-primary-base);}
.gstep-label{font-size:12px;font-weight:600;color:var(--a-neutral-text-muted);margin-top:8px;text-align:center;}
.gstep.active .gstep-label{color:var(--a-neutral-text-default);}
.gstep-line{position:absolute;top:15px;left:50%;width:100%;height:2px;background:var(--a-neutral-border-strong);}
.gstep.done .gstep-line{background:var(--a-primary-base);}
.gstep:last-child .gstep-line{display:none;}
/* numeric stepper input */
.gstepper-num{display:inline-flex;align-items:center;border:1.5px solid var(--a-neutral-border);border-radius:8px;overflow:hidden;}
.gstepper-num button{width:32px;height:36px;border:none;background:var(--a-neutral-surface-sunken);color:var(--a-neutral-text-default);font-size:15px;cursor:pointer;}
.gstepper-num button:hover{background:var(--a-neutral-border);}
.gstepper-num input{width:44px;height:36px;border:none;border-left:1px solid var(--a-neutral-border);border-right:1px solid var(--a-neutral-border);text-align:center;font-family:var(--font-body,var(--ui-font));font-size:13.5px;}

/* ---- Date Picker ---- */
.gdatepicker{background:var(--a-neutral-surface);border:1px solid var(--a-neutral-border);border-radius:12px;padding:16px;width:280px;box-shadow:var(--shadow-sm);}
.gdp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:700;font-size:13.5px;}
.gdp-nav{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--a-neutral-text-muted);cursor:pointer;}
.gdp-nav:hover{background:var(--a-neutral-surface-sunken);}
.gdp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.gdp-dow{font-size:10.5px;font-weight:700;color:var(--a-neutral-text-subtle);text-align:center;padding:4px 0;}
.gdp-day{font-size:12.5px;text-align:center;padding:7px 0;border-radius:7px;cursor:pointer;color:var(--a-neutral-text-default);}
.gdp-day:hover{background:var(--a-neutral-surface-sunken);}
.gdp-day.muted{color:var(--a-neutral-text-subtle);}
.gdp-day.today{border:1.5px solid var(--a-primary-base);}
.gdp-day.selected{background:var(--a-primary-base);color:var(--a-primary-fg);font-weight:700;}
.gdp-day.disabled{color:var(--a-neutral-text-subtle);opacity:.4;cursor:not-allowed;text-decoration:line-through;}

/* ---- Input OTP ---- */
.gotp-row{display:flex;gap:8px;}
.gotp-box{width:42px;height:48px;border:1.5px solid var(--a-neutral-border);border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--font-body,var(--ui-font));font-size:18px;font-weight:700;color:var(--a-neutral-text-default);background:var(--a-neutral-surface);}
.gotp-box.st-focus{border-color:var(--a-primary-base);box-shadow:0 0 0 3px var(--a-primary-soft);}
.gotp-box.st-error{border-color:var(--a-error-base);}
.gotp-box.st-disabled{background:var(--a-neutral-surface-sunken);color:var(--a-neutral-text-subtle);}

/* ---- File Upload ---- */
.gupload-zone{border:1.5px dashed var(--a-neutral-border-strong);border-radius:12px;padding:32px 20px;text-align:center;background:var(--a-neutral-surface-sunken);}
.gupload-zone.st-active{border-color:var(--a-primary-base);background:var(--a-primary-soft);}
.gupload-zone.st-error{border-color:var(--a-error-base);background:var(--a-error-soft);}
.gupload-icon{font-size:26px;color:var(--a-neutral-text-muted);margin-bottom:10px;}
.gupload-title{font-size:13.5px;font-weight:600;color:var(--a-neutral-text-default);margin-bottom:3px;}
.gupload-sub{font-size:12px;color:var(--a-neutral-text-muted);}
.gupload-file-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--a-neutral-border);border-radius:10px;background:var(--a-neutral-surface);}
.gupload-file-icon{width:34px;height:34px;border-radius:8px;background:var(--a-primary-soft);color:var(--a-primary-hover);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.gupload-file-meta{flex:1;min-width:0;}
.gupload-file-name{font-size:13px;font-weight:600;color:var(--a-neutral-text-default);}
.gupload-file-sub{font-size:11.5px;color:var(--a-neutral-text-muted);}
.gupload-progress-track{height:5px;background:var(--a-neutral-border);border-radius:4px;margin-top:6px;overflow:hidden;}
.gupload-progress-fill{height:100%;background:var(--a-primary-base);border-radius:4px;}

/* ---- Text Editor ---- */
.gtexteditor{border:1.5px solid var(--a-neutral-border);border-radius:12px;overflow:hidden;background:var(--a-neutral-surface);}
.gte-toolbar{display:flex;align-items:center;gap:2px;padding:8px 10px;border-bottom:1px solid var(--a-neutral-border);background:var(--a-neutral-surface-sunken);flex-wrap:wrap;}
.gte-btn{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--a-neutral-text-muted);cursor:pointer;font-size:14px;}
.gte-btn:hover{background:var(--a-neutral-border);color:var(--a-neutral-text-default);}
.gte-btn.active{background:var(--a-primary-soft);color:var(--a-primary-hover);}
.gte-divider{width:1px;height:20px;background:var(--a-neutral-border);margin:0 4px;}
.gte-body{padding:16px 18px;font-size:13.5px;line-height:1.7;color:var(--a-neutral-text-default);min-height:100px;}
.gte-body ul{margin:8px 0;padding-left:20px;}

/* ============ PREVIEW MODAL ============ */
.preview-overlay{position:fixed;inset:0;background:var(--canvas);z-index:150;display:flex;flex-direction:column;}
.preview-topbar{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--panel);flex-shrink:0;gap:16px;}
.preview-topbar-left{display:flex;align-items:center;gap:14px;min-width:0;}
.preview-title{font-family:var(--ui-display);font-weight:600;font-size:14.5px;white-space:nowrap;}
.preview-tabs{display:flex;gap:2px;overflow-x:auto;}
.preview-tab{padding:7px 12px;border-radius:var(--ui-radius-sm);font-size:12.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;white-space:nowrap;border:none;background:transparent;font-family:var(--ui-font);}
.preview-tab:hover{background:var(--panel-sunken);}
.preview-tab.active{background:var(--ink);color:#fff;font-weight:600;}
.preview-viewport-toggle{display:flex;gap:2px;background:var(--panel-sunken);border:1px solid var(--line);border-radius:var(--ui-radius-sm);padding:3px;flex-shrink:0;}
.preview-viewport-toggle button{border:none;background:transparent;padding:6px 10px;border-radius:5px;cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;}
.preview-viewport-toggle button.active{background:var(--panel);color:var(--ink);box-shadow:var(--ui-shadow-sm);}
.preview-body{flex:1;overflow-y:auto;padding:32px;display:flex;justify-content:center;}
.preview-frame-wrap{width:100%;max-width:1280px;background:var(--bg-surface,#fff);border-radius:var(--ui-radius-lg);overflow:hidden;box-shadow:var(--ui-shadow-md);transition:max-width .2s ease;height:fit-content;}
.preview-frame-wrap.vp-mobile{max-width:390px;}
.preview-frame-wrap.vp-tablet{max-width:760px;}

/* ============ PLAYGROUND ============ */
.pg-shell{display:flex;gap:0;height:100%;}
.pg-main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--canvas);}
.pg-toolbar-row{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--panel);flex-shrink:0;gap:16px;}
.pg-tabs{display:flex;gap:2px;overflow-x:auto;}
.pg-tab{padding:7px 12px;border-radius:var(--ui-radius-sm);font-size:12.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;white-space:nowrap;border:none;background:transparent;font-family:var(--ui-font);}
.pg-tab:hover{background:var(--panel-sunken);}
.pg-tab.active{background:var(--ink);color:#fff;font-weight:600;}
.pg-canvas{flex:1;overflow:auto;padding:32px;display:flex;justify-content:center;position:relative;}
.pg-frame-wrap{width:100%;max-width:1280px;background:var(--bg-surface,#fff);border-radius:var(--ui-radius-lg);overflow:visible;box-shadow:var(--ui-shadow-md);transition:max-width .2s ease;height:fit-content;position:relative;}
.pg-frame-wrap.vp-mobile{max-width:390px;}
.pg-frame-wrap.vp-tablet{max-width:760px;}
.pg-frame-inner{border-radius:var(--ui-radius-lg);overflow:hidden;}
.pg-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;color:var(--ink-soft);text-align:center;padding:40px;}

/* highlight ring around whatever is currently selected in the preview */
.pg-selected{outline:2px solid var(--accent) !important;outline-offset:2px;border-radius:4px;position:relative;}
.pg-hoverable{cursor:pointer;transition:outline .1s ease;}
.pg-hoverable:hover{outline:1.5px dashed var(--line-strong);outline-offset:2px;}

/* floating contextual toolbar */
.pg-popover{
  position:absolute;z-index:40;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--ui-radius-md);box-shadow:var(--ui-shadow-md);padding:12px;
  min-width:240px;max-width:300px;
}
.pg-popover-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line);}
.pg-popover-head .type{font-family:var(--ui-display);font-weight:600;font-size:12.5px;}
.pg-popover-close{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);font-size:12px;}
.pg-popover-close:hover{background:var(--panel-sunken);}
.pg-field{margin-bottom:10px;}
.pg-field:last-child{margin-bottom:0;}
.pg-field-label{font-size:11px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.pg-swatch-row{display:flex;gap:6px;flex-wrap:wrap;}
.pg-role-swatch{width:26px;height:26px;border-radius:6px;border:2px solid transparent;cursor:pointer;flex-shrink:0;}
.pg-role-swatch.active{border-color:var(--ink);}
.pg-seg-row{display:flex;gap:4px;background:var(--panel-sunken);border:1px solid var(--line);border-radius:7px;padding:2px;}
.pg-seg-row button{flex:1;border:none;background:transparent;padding:6px 4px;font-size:11px;font-weight:500;border-radius:5px;cursor:pointer;color:var(--ink-soft);}
.pg-seg-row button.active{background:var(--ink);color:#fff;font-weight:600;}

/* right rail — Text Style Tokens editor */
.pg-rail{width:320px;flex-shrink:0;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;}
.pg-rail-head{padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2;}
.pg-rail-head h3{margin:0 0 4px;font-family:var(--ui-display);font-size:14px;font-weight:600;}
.pg-rail-head p{margin:0;font-size:11.5px;color:var(--ink-soft);line-height:1.5;}
.pg-rail-body{padding:14px;}
.pg-token-row{border:1px solid var(--line);border-radius:var(--ui-radius-md);padding:12px;margin-bottom:10px;}
.pg-token-row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.pg-token-row-head .key{font-family:var(--ui-mono);font-size:10.5px;font-weight:700;color:var(--accent);text-transform:uppercase;}
.pg-token-remove{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--bad);font-size:11px;}
.pg-token-remove:hover{background:var(--panel-sunken);}
.pg-token-sample{overflow-wrap:anywhere;margin-bottom:8px;color:var(--ink);}
.pg-token-mini-row{display:flex;gap:6px;align-items:center;}
.pg-token-mini-row input[type=range]{flex:1;}
.pg-token-mini-val{font-family:var(--ui-mono);font-size:10px;color:var(--ink-soft);width:38px;text-align:right;flex-shrink:0;}

/* preview content, all driven by design tokens */
.pv{font-family:var(--font-body);color:var(--text-default);background:var(--bg-surface);}
.pv h1,.pv h2,.pv h3,.pv h4{font-family:var(--font-heading);margin:0;color:var(--text-default);}
.pv-nav{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) var(--space-8);border-bottom:1px solid var(--border-default);}
.pv-nav-brand{display:flex;align-items:center;gap:8px;font-family:var(--font-heading);font-weight:700;font-size:16px;}
.pv-nav-links{display:flex;gap:var(--space-6);color:var(--text-muted);font-size:13.5px;font-weight:500;}
.pv-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--radius-md);font-weight:600;font-size:13.5px;border:1.5px solid transparent;cursor:pointer;font-family:var(--font-body);}
.pv-btn-primary{background:var(--a-primary-base);color:var(--a-primary-fg);border-color:var(--a-primary-base);}
.pv-btn-outline{background:transparent;color:var(--text-default);border-color:var(--border-strong);}
.pv-eyebrow{display:inline-flex;align-items:center;gap:6px;background:var(--bg-primary-soft);color:var(--a-primary-hover);font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;margin-bottom:var(--space-4);}
.pv-hero{padding:var(--space-16) var(--space-8);text-align:center;}
.pv-hero p{color:var(--text-muted);max-width:520px;margin:var(--space-4) auto var(--space-6);line-height:1.6;}
.pv-hero-actions{display:flex;gap:10px;justify-content:center;}
.pv-section{padding:var(--space-10) var(--space-8);}
.pv-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-5);}
.pv-card{border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:var(--space-5);background:var(--bg-surface);}
.pv-card-icon{width:38px;height:38px;border-radius:var(--radius-md);background:var(--bg-primary-soft);color:var(--icon-primary);display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:var(--space-3);}
.pv-card h3{font-size:15px;margin-bottom:var(--space-2);}
.pv-card p{font-size:13px;color:var(--text-muted);line-height:1.5;margin:0;}

.pv-docs{display:grid;grid-template-columns:220px 1fr;min-height:520px;}
.pv-docs-side{background:var(--bg-surface-sunken);border-right:1px solid var(--border-default);padding:var(--space-6) var(--space-4);}
.pv-docs-cat{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-subtle);margin:var(--space-4) 0 var(--space-2);}
.pv-docs-link{padding:7px 10px;border-radius:7px;font-size:13px;color:var(--text-muted);cursor:pointer;}
.pv-docs-link.active{background:var(--bg-surface);color:var(--a-primary-base);font-weight:600;box-shadow:var(--shadow-sm);}
.pv-docs-main{padding:var(--space-8);}
.pv-breadcrumb{display:flex;gap:6px;color:var(--text-subtle);font-size:12px;margin-bottom:var(--space-3);}
.pv-docs-main p{color:var(--text-muted);line-height:1.65;margin:var(--space-3) 0;}
.pv-code{background:var(--bg-inverse);color:#D9E0FF;font-family:var(--font-code);font-size:13px;padding:var(--space-4);border-radius:var(--radius-md);margin:var(--space-4) 0;overflow-x:auto;line-height:1.6;}

.pv-product{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-8);padding:var(--space-8);}
.pv-product-img{background:var(--bg-surface-sunken);border-radius:var(--radius-lg);min-height:340px;}
.pv-price{font-family:var(--font-heading);font-size:24px;font-weight:700;margin:var(--space-3) 0;}
.pv-rating{display:flex;align-items:center;gap:6px;color:var(--text-muted);font-size:13px;margin-bottom:var(--space-4);}
.pv-stars{color:#F5B301;display:flex;gap:2px;}
.pv-product p.desc{color:var(--text-muted);line-height:1.6;margin-bottom:var(--space-5);}
.pv-spec-row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--border-default);font-size:13px;}
.pv-spec-row span:first-child{color:var(--text-subtle);}

.pv-dash{display:grid;grid-template-columns:200px 1fr;min-height:560px;}
.pv-dash-side{background:var(--bg-surface-sunken);border-right:1px solid var(--border-default);padding:var(--space-5) var(--space-3);}
.pv-dash-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;font-size:13px;color:var(--text-muted);margin-bottom:2px;}
.pv-dash-item.active{background:var(--bg-surface);color:var(--text-default);font-weight:600;box-shadow:var(--shadow-sm);}
.pv-dash-main{padding:var(--space-6);}
.pv-dash-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-5);}
.pv-stat{border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:var(--space-4);}
.pv-stat .lbl{font-size:12px;color:var(--text-muted);}
.pv-stat .num{font-family:var(--font-heading);font-size:22px;font-weight:700;margin:6px 0;}
.pv-stat .delta{font-size:11.5px;color:var(--a-success-base);}
.pv-activity-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border-default);font-size:13px;}
.pv-activity-icon{width:30px;height:30px;border-radius:8px;background:var(--bg-primary-soft);color:var(--icon-primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}

.pv-phone{width:320px;margin:var(--space-8) auto;border:9px solid var(--bg-inverse);border-radius:36px;overflow:hidden;box-shadow:var(--shadow-lg);background:var(--bg-surface);}
.pv-status-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 2px;font-size:12px;font-weight:700;color:var(--text-default);}
.pv-status-icons{display:flex;align-items:center;gap:4px;}
.pv-app-header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 16px;}
.pv-app-header .greet{font-size:11px;color:var(--text-muted);}
.pv-app-header .name{font-family:var(--font-heading);font-size:15px;font-weight:700;color:var(--text-default);}
.pv-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--a-primary-base),var(--a-accent-base,var(--a-primary-hover)));flex-shrink:0;}
.pv-phone-body{padding:0 var(--space-4) var(--space-4);min-height:420px;}
.pv-balance-card{background:linear-gradient(135deg,var(--a-primary-base),var(--a-primary-active));color:var(--a-primary-fg);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:18px;}
.pv-balance-card .lbl{font-size:11px;opacity:.8;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.pv-balance-card .amt{font-family:var(--font-heading);font-size:26px;font-weight:700;margin:6px 0 16px;}
.pv-quick-actions{display:flex;justify-content:space-between;gap:8px;}
.pv-quick-action{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
.pv-quick-action-icon{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;}
.pv-quick-action-lbl{font-size:10px;font-weight:600;}
.pv-section-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.pv-section-label h4{font-size:13px;font-weight:700;color:var(--text-default);margin:0;}
.pv-section-label .link{font-size:11.5px;color:var(--a-primary-base);font-weight:600;}
.pv-mobile-card{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border-default);border-radius:var(--radius-md);margin-bottom:8px;}
.pv-mobile-card-icon{width:36px;height:36px;border-radius:var(--radius-md);background:var(--bg-primary-soft);color:var(--icon-primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pv-mobile-card .meta .title{font-size:13px;font-weight:600;color:var(--text-default);}
.pv-mobile-card .meta .sub{font-size:11px;color:var(--text-subtle);margin-top:1px;}
.pv-mobile-card .amt{font-size:13px;font-weight:700;}
.pv-mobile-card .amt.pos{color:var(--a-success-base);}
.pv-tabbar{display:flex;justify-content:space-around;padding:12px 0;border-top:1px solid var(--border-default);}
.pv-tabbar-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-subtle);font-size:10px;font-weight:600;}
.pv-tabbar-item.active{color:var(--a-primary-base);}

/* ============ PREVIEW RESPONSIVE OVERRIDES ============
   The frame's on-screen width is controlled by max-width on .preview-frame-wrap
   (vp-mobile/vp-tablet), not the real browser viewport — so normal @media
   queries never fire here. These rules key off that wrapper class instead,
   which is what actually determines the frame's rendered width. Inline
   font-size styles (set from --ts-* tokens in JS) need !important to yield. */
.preview-frame-wrap.vp-mobile .pv-nav{padding:12px 16px;}
.preview-frame-wrap.vp-mobile .pv-nav-links{display:none;}
.preview-frame-wrap.vp-mobile .pv-hero{padding:40px 20px;}
.preview-frame-wrap.vp-mobile .pv-hero h1{font-size:28px !important;line-height:1.18 !important;}
.preview-frame-wrap.vp-mobile .pv-hero p{font-size:13.5px;}
.preview-frame-wrap.vp-mobile .pv-section{padding:28px 20px;}
.preview-frame-wrap.vp-mobile .pv-grid3{grid-template-columns:1fr;}
.preview-frame-wrap.vp-tablet .pv-hero{padding:56px 32px;}
.preview-frame-wrap.vp-tablet .pv-hero h1{font-size:42px !important;}
.preview-frame-wrap.vp-tablet .pv-grid3{grid-template-columns:repeat(2,1fr);}

.preview-frame-wrap.vp-mobile .pv-docs{grid-template-columns:1fr;min-height:0;}
.preview-frame-wrap.vp-mobile .pv-docs-side{display:flex;gap:4px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border-default);padding:12px;white-space:nowrap;}
.preview-frame-wrap.vp-mobile .pv-docs-cat{display:none;}
.preview-frame-wrap.vp-mobile .pv-docs-link{flex-shrink:0;}
.preview-frame-wrap.vp-mobile .pv-docs-main{padding:20px;}
.preview-frame-wrap.vp-mobile .pv-docs-main h1{font-size:22px !important;}
.preview-frame-wrap.vp-mobile .pv-code{font-size:11.5px;padding:12px;}

.preview-frame-wrap.vp-mobile .pv-product{grid-template-columns:1fr;gap:20px;padding:20px;}
.preview-frame-wrap.vp-mobile .pv-product-img{min-height:200px;}
.preview-frame-wrap.vp-mobile .pv-product h1{font-size:21px !important;}
.preview-frame-wrap.vp-tablet .pv-product{padding:28px;gap:24px;}
.preview-frame-wrap.vp-tablet .pv-product-img{min-height:280px;}

.preview-frame-wrap.vp-mobile .pv-dash{grid-template-columns:1fr;min-height:0;}
.preview-frame-wrap.vp-mobile .pv-dash-side{display:flex;gap:4px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border-default);padding:10px;}
.preview-frame-wrap.vp-mobile .pv-dash-item{flex-shrink:0;white-space:nowrap;}
