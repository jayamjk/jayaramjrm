/* ---- right rail: editable Text Style Tokens, scoped to Playground ---- */
function buildPlaygroundRail(){
  const rail = h("div",{class:"pg-rail"});
  rail.appendChild(h("div",{class:"pg-rail-head"},
    h("h3",{},"Text Style Tokens"),
    h("p",{},"Editable copies of your type scale, just for Playground. Add or remove steps — it stays tied to your scale ratio.")
  ));
  const body = h("div",{class:"pg-rail-body", id:"pgRailBody"});
  rail.appendChild(body);
  setTimeout(renderPlaygroundRailBody, 0);
  return rail;
}
function renderPlaygroundRailBody(){
  const body = document.getElementById("pgRailBody");
  if(!body) return;
  body.innerHTML = "";
  const t = state.playground.typography;

  const scaleRow = h("div",{class:"row2", style:"margin-bottom:14px;"},
    h("button",{class:"btn btn-sm", onclick:()=>{ t.scaleUp++; pgRefresh(); renderPlaygroundRailBody(); }}, "↑ Scale Up"),
    h("button",{class:"btn btn-sm", onclick:()=>{ t.scaleDown++; pgRefresh(); renderPlaygroundRailBody(); }}, "↓ Scale Down"),
  );
  body.appendChild(scaleRow);

  textStyleTokens(t).forEach(ts=>{
    const row = h("div",{class:"pg-token-row"});
    row.appendChild(h("div",{class:"pg-token-row-head"},
      h("span",{class:"key"}, ts.key),
      ts.removable ? h("span",{class:"pg-token-remove", onclick:()=>{
        if(ts.removeDir==="up") t.scaleUp--; else t.scaleDown--;
        pgRefresh(); renderPlaygroundRailBody();
      }},"✕") : ""
    ));
    row.appendChild(h("div",{class:"pg-token-sample", style:`font-family:'${ts.family}',sans-serif;font-size:${Math.min(ts.px,28)}px;font-weight:${ts.weight};`}, ts.role==="code"?"code":"Aa"));
    if(!ts.custom){
    row.appendChild(h("div",{class:"pg-token-mini-row", style:"margin-bottom:6px;"},
      h("span",{style:"font-size:10px;color:var(--ink-soft);width:38px;flex-shrink:0;"},"Size"),
      h("input",{type:"range", min:10, max:120, step:1, value:ts.px, oninput:(e)=>{
        const power = getTextStyleSteps(t).find(s=>s[0]===ts.key)[2];
        // pin this step by nudging base/ratio is complex; instead store a per-step px override
        state.playground._sizeOverrides = state.playground._sizeOverrides||{};
        state.playground._sizeOverrides[ts.key] = parseFloat(e.target.value);
        pgApplySizeOverrides();
      }}),
      h("span",{class:"pg-token-mini-val"}, ts.px+"px")
    ));
    }
    body.appendChild(row);
  });
}
/* per-step manual size pins layered on top of the ratio-driven scale —
   lets one step be nudged without needing to solve backward for a new ratio */
function pgApplySizeOverrides(){
  const container = document.getElementById("pgFrameInner");
  if(!container) return;
  const overrides = state.playground._sizeOverrides || {};
  Object.entries(overrides).forEach(([key,px])=>{
    container.style.setProperty(`--ts-${key}-size`, (px/16).toFixed(3)+"rem");
  });
}

/* ---- export: Playground Tokens, separate from the real Global export ---- */
function generatePlaygroundTokensJson(){
  const pg = state.playground;
  const palettes = computeAllPalettes(pg.colors);
  const styles = textStyleTokens(pg.typography);
  const fmtPx = (px)=> pg.typography.rounding ? Math.round(px)+"px" : parseFloat(px.toFixed(2))+"px";
  return {
    _note: "These are PLAYGROUND tokens — an experimental fork, NOT your real Global Tokens. Use the Tokens & Export tab for your actual design system.",
    colors: Object.fromEntries(Object.entries(palettes).map(([name,scale])=>[name, Object.fromEntries(SCALE_STOPS.map(s=>[s,scale[s]]))])),
    typography: {
      fontFamily: { primary: pg.typography.primary.family, secondary: pg.typography.secondary?pg.typography.secondary.family:undefined, mono: pg.typography.mono?pg.typography.mono.family:undefined },
      textStyles: Object.fromEntries(styles.map(ts=>[ts.key, { size: fmtPx((state.playground._sizeOverrides||{})[ts.key]||ts.px), lineHeight: ts.lineHeight, weight: ts.weight }])),
    },
    spacing: { baseUnit: pg.spacing.baseUnit+"px", radiusBase: pg.spacing.radiusBase+"px" },
    shadows: { tinted: pg.shadows.tinted, intensity: pg.shadows.intensity },
  };
}
function openPlaygroundExportModal(){
  const root = document.getElementById("modalRoot");
  const close = ()=>{ root.innerHTML = ""; };
  const code = JSON.stringify(generatePlaygroundTokensJson(), null, 2);
  const overlay = h("div",{class:"modal-overlay", onclick:(e)=>{ if(e.target===overlay) close(); }});
  const modal = h("div",{class:"modal"},
    h("div",{class:"modal-head"}, h("h3",{},"Export Playground Tokens"), h("button",{class:"btn btn-icon", onclick:close},"✕")),
    h("div",{style:"padding:14px 22px 0;font-size:12.5px;color:var(--ink-soft);line-height:1.5;background:var(--panel-sunken);border-bottom:1px solid var(--line);padding-bottom:14px;"},
      "⚠ This is a separate experimental export from Playground — not your real design system. Your actual tokens are unchanged and available in the Tokens & Export tab."),
    h("div",{class:"modal-body"}, h("pre",{class:"code-block"}, code)),
    h("div",{class:"modal-foot"},
      h("button",{class:"btn", onclick:close},"Close"),
      h("button",{class:"btn btn-accent", onclick:()=>copyText(code)},"Copy JSON")
    )
  );
  overlay.appendChild(modal); root.appendChild(overlay);
}

const SECTIONS = [
  {k:"colors", l:"Colors"},
  {k:"spacing", l:"Layout & Spacing"},
  {k:"typography", l:"Typography"},
  {k:"shadows", l:"Shadows"},
  {k:"icons", l:"Iconography"},
  {k:"components", l:"Components"},
  {k:"playground", l:"Playground"},
  {k:"tokens", l:"Tokens & Export"},
];
function renderSectionNav(){
  const nav = document.getElementById("sectionNav");
  nav.innerHTML = "";
  SECTIONS.forEach(s=>{
    nav.appendChild(h("button",{class:"snav-btn"+(state.section===s.k?" active":""), onclick:()=>{
      state.section = s.k; renderApp();
    }}, s.l));
  });
}

/* =====================================================================
   MASTER RENDER
   ===================================================================== */
/* Converts every flat .group (title + description + fields, all always
   visible) rendered by any buildXSidebar() into a Fluent Accordion section
   — collapsible, with state persisted per-tab-per-group across re-renders.
   Done as a single DOM pass here rather than editing every group-building
   call site individually: same fix, one place, can't drift out of sync. */
const CHEVRON_SVG = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M3 1.5L7 5L3 8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ALWAYS_OPEN_GROUPS = new Set(["Breakpoints"]); // foundational, cross-tab state — shouldn't be tucked away
function enhanceGroupsAsAccordion(container, sectionKey){
  const groups = Array.from(container.querySelectorAll(".group"));
  groups.forEach((g, idx)=>{
    const titleEl = g.querySelector(":scope > .group-title");
    if(!titleEl) return; // not a standard group shape — leave untouched
    const key = sectionKey+":"+titleEl.textContent.trim();
    const defaultOpen = idx===0 || ALWAYS_OPEN_GROUPS.has(titleEl.textContent.trim()); // first section per tab, plus anything foundational, open by default
    const isOpen = key in state.ui.groupOverrides ? state.ui.groupOverrides[key] : defaultOpen;

    const rest = Array.from(g.children).filter(c=>c!==titleEl);
    const head = h("div",{class:"group-head", tabindex:"0", role:"button", "aria-expanded":isOpen?"true":"false"},
      h("div",{class:"group-chevron", html:CHEVRON_SVG}),
      titleEl
    );
    const body = h("div",{class:"group-body"});
    rest.forEach(el=>body.appendChild(el));

    g.innerHTML = "";
    g.appendChild(head); g.appendChild(body);
    g.classList.toggle("open", isOpen);
    body.style.display = isOpen ? "" : "none";

    const toggle = ()=>{
      const nowOpen = !g.classList.contains("open");
      g.classList.toggle("open", nowOpen);
      body.style.display = nowOpen ? "" : "none";
      head.setAttribute("aria-expanded", nowOpen?"true":"false");
      state.ui.groupOverrides[key] = nowOpen;
    };
    head.addEventListener("click", toggle);
    head.addEventListener("keydown",(e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } });
  });
}

function renderApp(skipSidebar){
  applyGlobalTokenVars();
  renderSectionNav();
  const builders = {
    colors:{sidebar:buildColorsSidebar, stage:buildColorsStage},
    typography:{sidebar:buildTypographySidebar, stage:buildTypographyStage},
    spacing:{sidebar:buildSpacingSidebar, stage:buildSpacingStage},
    shadows:{sidebar:buildShadowsSidebar, stage:buildShadowsStage},
    icons:{sidebar:buildIconsSidebar, stage:buildIconsStage},
    components:{sidebar:buildComponentsSidebar, stage:buildComponentsStage},
    playground:{sidebar:buildPlaygroundSidebar, stage:buildPlaygroundStage},
    tokens:{sidebar:buildTokensSidebar, stage:buildTokensStage},
  };
  const b = builders[state.section];
  const sidebarBody = document.getElementById("sidebarBody");
  const stage = document.getElementById("stage");
  stage.classList.toggle("stage-flush", state.section==="playground");
  if(!skipSidebar){ sidebarBody.innerHTML=""; sidebarBody.appendChild(b.sidebar()); enhanceGroupsAsAccordion(sidebarBody, state.section); }
  stage.innerHTML = ""; stage.appendChild(b.stage());
}

/* =====================================================================
   INIT
   ===================================================================== */
function init(){
  document.getElementById("exportBtn").addEventListener("click", ()=>openExportModal("css"));
  document.getElementById("previewBtn").addEventListener("click", openPreviewModal);
  // preload whatever font the Typography tab currently references, since it's
  // not part of the app's own head-linked fonts (DM Sans / JetBrains Mono)
  const t = state.typography;
  loadFont(t.primary.family, [300,400,500,600,700,800]);
  if(t.secondary) loadFont(t.secondary.family, [300,400,500,600,700,800]);
  if(t.mono) loadFont(t.mono.family, [400,500,600]);
  renderApp();
}
window.addEventListener("DOMContentLoaded", init);
</script>
